<svg xmlns="http://www.w3.org/2000/svg" viewBox="-380 -400 760 820" font-family="sans-serif" font-size="11">
  <!-- 俯視圖:1 m = 100 px;x 向右,z 向下(+Z 為教室後方) -->
  <rect x="-325" y="-380" width="650" height="750" fill="#FAF6EB" stroke="#33261D" stroke-width="3"/>
  <!-- 黑板 / 講桌 -->
  <rect x="-200" y="-382" width="400" height="8" fill="#2E3230"/><text x="-30" y="-386">黑板 4.0 m</text>
  <line x1="-100" y1="-374" x2="-100" y2="-360" stroke="#888"/><line x1="80" y1="-374" x2="80" y2="-360" stroke="#888"/>
  <text x="-195" y="-362">左區</text><text x="-20" y="-362">中區</text><text x="120" y="-362">右區</text>
  <rect x="-60" y="-320" width="120" height="60" fill="#DCC6A2" stroke="#33261D"/><text x="-18" y="-286">講桌</text>
  <circle cx="0" cy="-210" r="5" fill="#B2C8DC"/><text x="8" y="-206">boardViewpoint (0,−2.1)</text>
  <!-- 窗 -->
  <g fill="#DCE6EC" stroke="#33261D"><rect x="-330" y="-330" width="10" height="180"/><rect x="-330" y="-110" width="10" height="180"/><rect x="-330" y="110" width="10" height="180"/></g>
  <text x="-375" y="-240" transform="rotate(-90 -365 -240)">窗 z=−2.4</text>
  <!-- 學生工作桌 -->
  <rect x="-80" y="-105" width="160" height="90" fill="#E4CFAB" stroke="#33261D" stroke-width="2"/>
  <rect x="-40" y="-100" width="80" height="80" fill="none" stroke="#B2C8DC" stroke-dasharray="4 3"/><text x="-36" y="-56" font-size="9">教具掛載區</text>
  <rect x="-92" y="-72" width="12" height="24" fill="#CFC8BC"/><text x="-125" y="-80" font-size="9">虎鉗</text>
  <rect x="64" y="-100" width="16" height="10" fill="#B9BEC1"/><text x="85" y="-95" font-size="9">肘節夾鉗+鐵罐</text>
  <circle cx="0" cy="0" r="6" fill="#33261D"/><text x="10" y="14">原點(學生,面向 −Z)</text>
  <!-- 其他工作桌 -->
  <rect x="-270" y="-205" width="160" height="90" fill="#E4CFAB" stroke="#33261D"/>
  <rect x="-270" y="35" width="160" height="90" fill="#E4CFAB" stroke="#33261D"/>
  <!-- 右牆 -->
  <rect x="315" y="-220" width="10" height="240" fill="#DCC6A2" stroke="#33261D"/><text x="250" y="-100">洞洞板</text>
  <rect x="317" y="20" width="8" height="90" fill="#EEE5CF"/><text x="262" y="70">圍裙</text>
  <rect x="245" y="105" width="40" height="55" fill="#EAE3D3" stroke="#33261D"/><text x="215" y="140">鑽床</text>
  <rect x="240" y="235" width="40" height="50" fill="#EAE3D3" stroke="#33261D"/><text x="205" y="268">帶鋸機</text>
  <!-- 後牆 -->
  <rect x="-305" y="248" width="215" height="122" fill="#C8B59A" stroke="#33261D"/><text x="-250" y="315">木料架 / 密集板</text>
  <rect x="-65" y="320" width="20" height="45" fill="#DCC6A2"/><text x="-80" y="315" font-size="9">角材</text>
  <circle cx="-12" cy="338" r="24" fill="#9EA3A6"/><text x="-30" y="300" font-size="9">垃圾桶</text>
  <rect x="35" y="328" width="180" height="42" fill="#F6E9D2" stroke="#33261D"/><text x="90" y="352">作品展示櫃</text>
  <rect x="225" y="366" width="90" height="8" fill="#AE977A"/><text x="250" y="390">木門</text>
  <text x="-320" y="410" fill="#666">x: −3.25 … +3.25 m  ·  z: −3.8(前)… +3.7(後)  ·  天花板 3.0 m</text>
</svg>
